<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <a href="../index.html">← Back to Home</a>
  <div class="container">
    <h1>Online Student Management System</h1>
    <div class="form-card">
      <div class="form-grid">
        
        <input type="text" id="loginUsername" placeholder="Enter Username" ><br><br>
        <input type="password" id="loginPassword" placeholder="Enter Password" ><br><br>
      </div>
      <div class="actions">
        <button onclick="loginStudent()">Login</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
